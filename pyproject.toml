[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-paper-library"
version = "0.3.1"
description = "A local paper library and research discussion server"
requires-python = ">=3.11"
dependencies = ["cryptography>=40", "webauthn>=2.2,<3"]

[project.optional-dependencies]
google = ["google-auth[requests]>=2,<3"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
include = ["paper_app*", "paper_client*"]
namespaces = false

[tool.setuptools.package-data]
paper_app = ["web/*.html", "web/*.css", "web/*.js", "sql/*.sql", "web/prompts/*.md", "web/prompts/*.json"]
paper_client = ["pyproject.toml", "review-prompt.md"]
