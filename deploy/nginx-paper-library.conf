# Load from the Nginx http context, for example /etc/nginx/conf.d/paper-library.conf.
# Replace the example hostname and certificate paths before enabling.
map $uri $paper_library_log_path {
    ~^/api/ai/register/ /api/ai/register/[redacted];
    default $uri;
}

log_format paper_library '$remote_addr [$time_local] "$request_method $paper_library_log_path" $status $body_bytes_sent';

map $uri $paper_library_auth_client {
    ~^/(api/(human-key/|human-invitations$|ai/|sign-in$|register$)|auth/google) $binary_remote_addr;
    default "";
}

limit_req_zone $paper_library_auth_client zone=paper_library_auth:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name papers.example.org;
    return 308 https://papers.example.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name papers.example.org;
    ssl_certificate /etc/letsencrypt/live/papers.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/papers.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/paper-library.access.log paper_library;
    client_max_body_size 100m;
    limit_req zone=paper_library_auth burst=30 nodelay;
    limit_req_status 429;

    if ($host != papers.example.org) { return 421; }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $http_host;
        proxy_read_timeout 120s;
    }
}
