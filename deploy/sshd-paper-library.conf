# Standalone OpenSSH configuration. Replace the workspace user, port, and config path.
Port 2222
HostKey /etc/ssh/ssh_host_ed25519_key
PidFile /run/paper-library-git-sshd.pid
UsePAM yes
AllowUsers paper-library
PermitRootLogin no
AuthenticationMethods publickey
PubkeyAuthentication yes
PubkeyAcceptedAlgorithms ssh-ed25519
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthorizedKeysFile none
AuthorizedKeysCommand /opt/paper-library/.venv/bin/python -I -m paper_app.git_ssh --config /etc/paper-library-git.toml authorized-key %t %k
AuthorizedKeysCommandUser paper-library
DisableForwarding yes
PermitTTY no
PermitUserEnvironment no
PermitUserRC no
AcceptEnv GIT_PROTOCOL
