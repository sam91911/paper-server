# Load once from the http context. Replace both names and use a certificate covering them.
map $host $paper_workspace_port {
    default "";
    alpha.papers.example.org 8771;
    beta.papers.example.org 8772;
}

map $uri $paper_workspace_log_path {
    ~^/api/ai/register/ /api/ai/register/[redacted];
    default $uri;
}

log_format paper_workspace '$remote_addr [$time_local] $host "$request_method $paper_workspace_log_path" $status $body_bytes_sent';

map $uri $paper_workspace_auth_client {
    ~^/(api/(human-key/|human-invitations$|ai/|sign-in$|register$)|auth/google) "$host:$binary_remote_addr";
    default "";
}

limit_req_zone $paper_workspace_auth_client zone=paper_workspace_auth:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name alpha.papers.example.org beta.papers.example.org;
    if ($paper_workspace_port = "") { return 421; }
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name alpha.papers.example.org beta.papers.example.org;
    ssl_certificate /etc/letsencrypt/live/papers.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/papers.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($paper_workspace_port = "") { return 421; }
    access_log /var/log/nginx/paper-workspaces.access.log paper_workspace;
    client_max_body_size 100m;
    limit_req zone=paper_workspace_auth burst=30 nodelay;
    limit_req_status 429;

    location / {
        proxy_pass http://127.0.0.1:$paper_workspace_port;
        proxy_set_header Host $http_host;
        proxy_read_timeout 120s;
    }
}
