[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-paper-library-client"
version = "0.3.1"
description = "Workstation AI review client for the local paper library"
requires-python = ">=3.11"
dependencies = ["cryptography>=40"]

[tool.setuptools]
packages = ["paper_client"]
package-dir = {paper_client = "."}

[tool.setuptools.package-data]
paper_client = ["review-prompt.md"]
