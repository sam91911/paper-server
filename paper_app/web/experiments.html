<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experiments</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><main><h1>Experiments</h1><p><a href="/">Compare</a> · <a href="/papers">Papers</a> · <a href="/documents">Documents</a> · <a href="/account">Account</a></p><p id="status" role="status"></p>
<section><h2>Experiments</h2><label>Choose experiment <select id="experiments"><option value="">Choose</option></select></label><form id="experiment-form"><h3>New experiment</h3><label>Title <input name="title" required maxlength="160"></label><label>Description <textarea name="description"></textarea></label><label>Paper ID (optional) <input name="paper_id" type="number" min="1"></label><label>Audience <select name="audience" class="audience"></select></label><button>Save experiment</button></form></section>
<section id="detail" hidden><h2 id="experiment-title"></h2><p id="experiment-description"></p><form id="run-form"><h3>New run</h3><label>Title <input name="title" required></label><label>Description <textarea name="description"></textarea></label><label>Audience <select name="audience" class="audience"></select></label><button>Save run</button></form><h3>Runs</h3><div id="runs"></div>
<form id="item-form"><h3>New artifact or version</h3><label>Existing item ID (for new version) <input name="id" type="number" min="1"></label><label>Current revision (for new version) <input name="revision" type="number" min="1"></label><label>Run <select name="run_id" id="run-select"><option value="">Experiment level</option></select></label><label>Type <select name="kind"><option value="code">Code</option><option value="environment">Environment</option><option value="equipment">Equipment</option><option value="tool_record">Tool record</option><option value="data">Data</option></select></label><label>Title <input name="title" required></label><label>Description <textarea name="description"></textarea></label><label>External location <input name="external_ref"></label><label>Upload (up to 100 MiB) <input name="file" type="file"></label><label>Audience <select name="audience" class="audience"></select></label><button>Save artifact</button></form><h3>Artifacts and versions</h3><div id="items"></div>
<form id="grant-form"><h3>Share</h3><label>Type <select name="kind"><option value="experiment">Experiment</option><option value="run">Run</option><option value="item">Artifact</option></select></label><label>ID <input name="id" type="number" min="1" required></label><label>Readers (usernames, comma separated) <input name="readers"></label><label>Editors (usernames, comma separated) <input name="editors"></label><button>Update sharing</button></form></section>
<section><h2>Tools</h2><div id="tools"></div><h3>Host capabilities</h3><div id="host-tools"></div></section></main><script src="/assets/api.js"></script><script src="/assets/experiments.js"></script></body></html>
