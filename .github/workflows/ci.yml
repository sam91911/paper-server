name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m compileall -q paper_app
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_metrics.mjs
      - run: node tests/test_comments.mjs
      - run: node tests/test_boot.mjs
      - run: node tests/test_document_comments.mjs
      - run: node tests/test_document_content.mjs
      - run: node tests/test_papers.mjs
