name: CI
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: SQLite and browser scripts (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install .
      - run: bash scripts/check.sh
  postgres:
    name: PostgreSQL 16 migrations and restore
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PAPER_TEST_POSTGRES_URL: postgresql://postgres:test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils postgresql-client-16
      - run: python -m pip install '.[postgres]'
      - run: bash scripts/check.sh --postgres
      - run: python -m scripts.benchmark_workflow --postgres --users 2 --agents 2 --rounds 2 --papers 50

  git-ssh:
    name: Git clone and push over OpenSSH
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y openssh-server python3-venv
      - name: Install the SSH authorization command
        run: |
          # OpenSSH also checks the ownership and permissions of parent directories.
          venv=/var/lib/paper-library-ssh-test
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" "$venv"
          /usr/bin/python3 -m venv --copies "$venv"
          "$venv/bin/python" -m pip install .
          sudo chown -R root:root "$venv"
          sudo chmod go-w "$venv" "$venv/bin" "$venv/bin/python"
      - run: systemd-analyze verify deploy/paper-library-git.service
      - run: /var/lib/paper-library-ssh-test/bin/python -m unittest discover -s tests -p test_git_ssh.py -v
        env:
          PAPER_TEST_SSHD: /usr/sbin/sshd

  package:
    name: Installed server and enrolled agent workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v0.')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v0\.(0|[1-9]\d*)\.(0|[1-9]\d*)", tag):
              raise SystemExit(f"Expected a v0.x.y release tag, received {tag!r}.")
          for package in ("pyproject.toml", "paper_client/pyproject.toml"):
              version = tomllib.loads(Path(package).read_text())["project"]["version"]
              if f"v{version}" != tag:
                  raise SystemExit(f"{package} declares {version}, which differs from {tag}.")
          PY
      - run: bash scripts/check-install.sh "$RUNNER_TEMP/paper-release"
      - name: Rehearse an upgrade from the previous release
        run: |
          set -euo pipefail
          previous_tag=$(git describe --tags --match 'v0.*' --abbrev=0 HEAD^)
          work=$(mktemp -d "$RUNNER_TEMP/paper-upgrade.XXXXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          mkdir "$work/previous"
          git archive "$previous_tag" | tar -x -C "$work/previous"
          python -m venv "$work/previous-env"
          python -m venv "$work/current-env"
          "$work/previous-env/bin/python" -m pip install "$work/previous"
          "$work/current-env/bin/python" -m pip install "$RUNNER_TEMP"/paper-release/*.whl
          "$work/previous-env/bin/python" -I scripts/check_release_upgrade.py seed "$work/library.sqlite3" "$work/fixture.json"
          "$work/current-env/bin/python" -I scripts/check_release_upgrade.py check "$work/library.sqlite3" "$work/fixture.json"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v0.')
        with:
          name: paper-release
          path: ${{ runner.temp }}/paper-release
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v0.')
    needs: [test, postgres, git-ssh, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paper-release
          path: ${{ runner.temp }}/paper-release
      - name: Publish tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd "$RUNNER_TEMP/paper-release"
          sha256sum -- *.whl paper-client.zip > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" *.whl paper-client.zip SHA256SUMS.txt
